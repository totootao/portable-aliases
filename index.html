<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>别名管理 · Portable Aliases</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --fg:#e6e9ef; --mut:#9aa3b2;
          --acc:#4f9dff; --red:#ff6b6b; --grn:#3ddc97; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header .tag { font-size:12px; color:var(--mut); }
  .wrap { display:grid; grid-template-columns:1.3fr 1fr; gap:18px; padding:18px 22px; }
  @media (max-width:900px){ .wrap{ grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { font-size:14px; margin:0 0 12px; color:var(--mut); font-weight:600; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:600; font-size:12px; }
  code { background:#0c0e12; padding:1px 6px; border-radius:5px; color:var(--grn); }
  .badge { font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--mut); }
  .badge.alias { color:var(--acc); border-color:#274a73; }
  .badge.function { color:var(--grn); border-color:#1f5a44; }
  button { cursor:pointer; border:none; border-radius:7px; padding:6px 12px; font-size:13px; }
  .btn-del { background:#3a1f25; color:var(--red); }
  .btn-edit { background:#1f2f3a; color:var(--acc); margin-right:6px; }
  .btn-add { background:var(--acc); color:#06121f; font-weight:600; width:100%; margin-top:10px; }
  .row { display:flex; gap:10px; margin-bottom:10px; }
  .row > * { flex:1; }
  label { display:block; font-size:12px; color:var(--mut); margin-bottom:4px; }
  input, select, textarea { width:100%; background:#0c0e12; border:1px solid var(--line);
         color:var(--fg); border-radius:7px; padding:8px 10px; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  textarea { min-height:70px; resize:vertical; }
  pre { background:#0c0e12; border:1px solid var(--line); border-radius:8px; padding:12px;
        max-height:420px; overflow:auto; white-space:pre; font:12px/1.5 ui-monospace,Menlo,monospace; color:#cfe3ff; }
  .hint { font-size:12px; color:var(--mut); margin-top:8px; }
  .bar { display:flex; gap:8px; margin-bottom:10px; }
  .bar button { background:#1f2f3a; color:var(--acc); }
  .toast { position:fixed; bottom:20px; right:20px; background:var(--grn); color:#06121f;
           padding:10px 16px; border-radius:8px; font-weight:600; opacity:0; transition:.25s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>🔧 别名管理面板</h1>
  <span class="tag">aliases.json → aliases.sh · 保存即重新生成</span>
</header>

<div class="wrap">
  <div class="card">
    <h2>当前别名 / 函数</h2>
    <table id="tbl">
      <thead><tr><th>类型</th><th>名称</th><th>定义</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h2>新增 / 编辑</h2>
    <div class="row">
      <div>
        <label>类型</label>
        <select id="f-type">
          <option value="alias">alias（别名）</option>
          <option value="function">function（函数）</option>
        </select>
      </div>
      <div>
        <label>名称</label>
        <input id="f-name" placeholder="如 ll 或 mkcd">
      </div>
    </div>
    <label id="l-value">定义（alias 写右侧命令；function 写函数体）</label>
    <textarea id="f-value" placeholder="如 ls -alF --color=auto"></textarea>
    <button class="btn-add" id="btn-add">保存</button>
    <div class="hint">函数体可多行，例如：<br><code>mkcd() { mkdir -p "$1" &amp;&amp; cd "$1"; }</code> 的函数体填 <code>mkdir -p "$1" &amp;&amp; cd "$1"</code></div>
  </div>

  <div class="card" style="grid-column:1 / -1;">
    <div class="bar">
      <button id="btn-refresh">↻ 刷新预览</button>
      <button id="btn-copy">⧉ 复制 aliases.sh</button>
    </div>
    <h2>生成的 aliases.sh（可直接 source）</h2>
    <pre id="sh">加载中…</pre>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let editing = null;

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

async function load(){
  const r = await fetch('/api/aliases'); const d = await r.json();
  const tb = $('#tbl tbody'); tb.innerHTML = '';
  d.entries.forEach(e=>{
    const tr = document.createElement('tr');
    const tag = e.type === 'alias' ? 'alias' : 'function';
    tr.innerHTML = `<td><span class="badge ${tag}">${tag}</span></td>
      <td><code>${escapeHtml(e.name)}</code></td>
      <td><code>${escapeHtml(e.value)}</code></td>
      <td><button class="btn-edit" data-n="${escapeHtml(e.name)}">编辑</button>
          <button class="btn-del" data-n="${escapeHtml(e.name)}">删除</button></td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('.btn-edit').forEach(b=>b.onclick=()=>edit(b.dataset.n));
  tb.querySelectorAll('.btn-del').forEach(b=>b.onclick=()=>del(b.dataset.n));
  refreshSh();
}

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function edit(name){
  const r = await fetch('/api/aliases'); const d = await r.json();
  const e = d.entries.find(x=>x.name===name); if(!e) return;
  $('#f-type').value = e.type; $('#f-name').value = e.name; $('#f-value').value = e.value;
  editing = name; $('#btn-add').textContent = '更新';
  window.scrollTo({top:0, behavior:'smooth'});
}

async function del(name){
  if(!confirm('确认删除 ' + name + ' ?')) return;
  await fetch('/api/aliases/' + encodeURIComponent(name), {method:'DELETE'});
  toast('已删除 ' + name); load();
}

async function refreshSh(){
  const r = await fetch('/api/aliases.sh'); $('#sh').textContent = await r.text();
}

$('#btn-add').onclick = async ()=>{
  const body = { type:$('#f-type').value, name:$('#f-name').value.trim(),
                 value:$('#f-value').value };
  if(!body.name){ toast('名称不能为空'); return; }
  await fetch('/api/aliases', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  toast(editing ? '已更新' : '已添加');
  $('#f-name').value=''; $('#f-value').value=''; editing=null; $('#btn-add').textContent='保存';
  load();
};
$('#btn-refresh').onclick = refreshSh;
$('#btn-copy').onclick = async ()=>{ await navigator.clipboard.writeText($('#sh').textContent); toast('已复制'); };

$('#f-type').onchange = ()=>{
  $('#l-value').textContent = $('#f-type').value==='alias'
    ? '定义（alias 右侧命令，如 ls -alF --color=auto）'
    : '函数体（多行，如 mkdir -p "$1" && cd "$1"）';
};

load();
</script>
</body>
</html>
